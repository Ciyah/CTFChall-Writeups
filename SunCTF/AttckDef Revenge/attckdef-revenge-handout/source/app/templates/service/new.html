{% extends "base.html" %}
{% block title %}New note — notestore{% endblock %}
{% block content %}
<section class="panel">
  <h2>New note</h2>
  <form id="note-form">
    <label>Title
      <input name="title" required maxlength="80" placeholder="weekend plans">
    </label>
    <label>Content
      <textarea name="content" required maxlength="2048" rows="4"></textarea>
    </label>
    <button class="btn" type="submit">Store note</button>
  </form>
  <pre class="out" id="out"></pre>
</section>
{% endblock %}
{% block script %}
<script>
wireForm("note-form", "/api/notes", "out", true);
</script>
{% endblock %}
