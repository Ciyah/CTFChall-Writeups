{% extends "base.html" %}
{% block title %}Sign in — notestore{% endblock %}
{% block content %}
<section class="panel">
  <h2>Sign in</h2>
  <form id="login-form">
    <label>Username
      <input name="username" required autocomplete="username">
    </label>
    <label>Password
      <input name="password" type="password" required autocomplete="current-password">
    </label>
    <button class="btn" type="submit">Sign in</button>
  </form>
  <pre class="out" id="out"></pre>
</section>
{% endblock %}
{% block script %}
<script>
wireForm("login-form", "/api/login", "out");
</script>
{% endblock %}
