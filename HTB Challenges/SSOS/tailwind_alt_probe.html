<!doctype html>
<html>
<head>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <img id="probe" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs="
       alt="bg-red-500 absolute bg-[url('https://example.invalid/tw-bg')]">
  <pre id="result">pending</pre>
  <script>
    setTimeout(() => {
      const css = [...document.querySelectorAll('style')].map(x => x.textContent).join('\n');
      document.querySelector('#result').textContent = JSON.stringify({
        redRuleGenerated: css.includes('.bg-red-500'),
        arbitraryRuleGenerated: css.includes('example.invalid'),
        imageClass: document.querySelector('#probe').className,
        backgroundImage: getComputedStyle(document.querySelector('#probe')).backgroundImage
      });
    }, 3000);
  </script>
</body>
</html>
