# /etc/nginx/sites-available/edulearn
map $http_host $redir_port {
    default "";
    ~*:(\d+)$ ":$1";
}

map $redir_port $final_port {
    default $redir_port;
    "" ":$server_port";
}

# Default server - redirect any unknown host/IP to edulearn.htb
# This catches requests to IP addresses or other hostnames
server {
    listen 1337 default_server;
    server_name _;

    # Redirect to edulearn.htb while preserving the port
    return 302 http://edulearn.htb$final_port$request_uri;
}

# Proxy requests for edulearn.htb:PORT → localhost:3000
server {
    listen 1337;
    server_name edulearn.htb;

    location / {
        # Forward to your app on port 3000
        proxy_pass http://127.0.0.1:3000;

        # Preserve headers - use $http_host to include the port!
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }
}

# Proxy requests for sso.edulearn.htb:PORT → localhost:3002
server {
    listen 1337;
    server_name sso.edulearn.htb;

    location / {
        # Forward to your SSO service on port 3002
        proxy_pass http://127.0.0.1:3002;

        # Preserve headers - use $http_host to include the port!
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }
}
